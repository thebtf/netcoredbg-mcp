name: Stateless Preview Build

on:
  workflow_dispatch:
    inputs:
      preview_version:
        description: Preview version in x.y.z-preview.n form
        required: true
        type: string
      preview_tag:
        description: Preview tag matching stateless-preview-v<preview_version>
        required: true
        type: string
      retention_days:
        description: Retention period from 1 through 90 days
        required: true
        type: string

permissions: {}

concurrency:
  group: stateless-preview-build-${{ inputs.preview_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build canonical-main preview candidate
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      A1_PREVIEW_VERSION: ${{ inputs.preview_version }}
      A1_PREVIEW_TAG: ${{ inputs.preview_tag }}
      A1_RETENTION_DAYS: ${{ inputs.retention_days }}
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch live canonical main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch canonical main."
          }

      - name: Admit the only build source and inputs
        id: admit
        shell: pwsh
        run: python scripts/stateless_preview_artifact.py admit-build

      - name: Set up the preview runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the repository Python runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install uv
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to install the repository Python runner."
          }

      - name: Run required builds and functional producers
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $functionalWorktree = Join-Path $env:RUNNER_TEMP "stateless-preview-functional-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          git -C $env:GITHUB_WORKSPACE worktree add --detach $functionalWorktree $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create the exact-head functional worktree."
          }
          $entered = $false
          try {
            Push-Location $functionalWorktree
            $entered = $true
            @'
          import uuid
          from pathlib import Path

          from scripts import run_sonarqube_exact_head as runner

          environment = runner.scrub_sonar_environment(runner.process_environment())
          context = runner.git_context(Path.cwd(), environment)
          runner.assert_no_in_tree_dotenv(context.repository_root)
          entry = runner.resolve_wave2_entry(context, environment)
          resolved_wave2 = runner.verify_wave2_entry(entry, context, environment)
          runner.assert_post_merge_target(context, environment)
          runner.clear_generated_artifacts(context, environment)
          runner.strict_cleanliness(context, environment, "functional producer start")
          runner.preflight_coverage_toolchain(context=context, environment=environment)
          runner.prepare_worktree_python_environment(context, environment, ())
          solution, _, standalone_projects = runner.project_inventory(context.repository_root)
          for project in (solution, *standalone_projects):
              runner.run_process(
                  ["dotnet", "build", str(project), "-nr:false"],
                  cwd=context.repository_root,
                  environment=environment,
                  secrets=(),
                  label=f"Required build ({project.name})",
              )
          plan = runner.derive_coverage_plan(context, str(uuid.uuid4()))
          claim = runner.claim_coverage_run(context, plan, resolved_wave2)
          stateless_before = runner.capture_stateless_binary_hashes(plan)
          runner.run_coverage_producer(plan, environment)
          dotnet_inputs = runner.validate_dotnet_cobertura_inputs(context, plan)
          normalization = runner.normalize_dotnet_cobertura(plan, dotnet_inputs)
          runner.validate_coverage_reports(
              context, plan, claim, stateless_before,
              dotnet_inputs=dotnet_inputs, normalization=normalization,
          )
          runner.clear_generated_artifacts(context, environment)
          cleanup = runner.cleanup_coverage_run(plan, True)
          if cleanup["status"] != "OK":
              raise runner.RunnerError("Functional producer cleanup failed.")
          runner.strict_cleanliness(context, environment, "functional producer completion")
          runner.assert_head_unchanged(context, environment)
          '@ | python -
            if ($LASTEXITCODE -ne 0) {
              throw "Required build or functional producer failed."
            }
          }
          finally {
            if ($entered) {
              Pop-Location
            }
            git -C $env:GITHUB_WORKSPACE worktree remove --force $functionalWorktree
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to remove the exact-head functional worktree."
            }
          }

      - name: Publish the self-contained win-x64 preview
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish host/NetCoreDbg.Mcp.Stateless.Preview/NetCoreDbg.Mcp.Stateless.Preview.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false --output artifacts/stateless-preview/publish
          if ($LASTEXITCODE -ne 0) {
            throw "Preview publish failed."
          }
          Rename-Item -Path artifacts/stateless-preview/publish/NetCoreDbg.Mcp.Stateless.Preview.exe -NewName netcoredbg-mcp-stateless-preview.exe

      - name: Archive and manifest the preview payload
        shell: pwsh
        run: python scripts/stateless_preview_artifact.py prepare-payload

      - name: Retain the immutable preview payload
        id: upload_payload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.payload_artifact_name }}
          path: artifacts/stateless-preview/payload/
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Seal candidate identity and release-gate catalog
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          A1_PAYLOAD_ARTIFACT_ID: ${{ steps.upload_payload.outputs.artifact-id }}
        run: python scripts/stateless_preview_artifact.py seal-build-records

      - name: Retain the immutable Candidate Identity Record
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.candidate_identity_artifact_name }}
          path: artifacts/stateless-preview/records/candidate-identity.json
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Retain the immutable Release Gate Catalog
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.release_gate_catalog_artifact_name }}
          path: artifacts/stateless-preview/records/release-gate-catalog.json
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}
