name: Stateless Preview Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a candidate, retain evidence / probe permissions, or promote
        required: true
        default: build
        type: choice
        options:
          - build
          - evidence
          - promote
      preview_version:
        description: Preview version in x.y.z-preview.n form
        required: false
        default: ""
        type: string
      preview_tag:
        description: Preview tag matching stateless-preview-v<preview_version>
        required: false
        default: ""
        type: string
      retention_days:
        description: Retention period from 1 through 90 days
        required: false
        default: ""
        type: string
      evidence_operation:
        description: Evidence operation (retain or permission-probe)
        required: false
        default: ""
        type: string
      evidence_request:
        description: Closed evidence-retention request JSON (retain only)
        required: false
        default: ""
        type: string
      promote_request:
        description: Closed retained promotion-decision.json reference (promote only)
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: stateless-preview-${{ inputs.preview_tag || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.mode != 'evidence' && inputs.mode != 'promote' }}
    name: Build canonical-main preview candidate
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      A1_PREVIEW_VERSION: ${{ inputs.preview_version }}
      A1_PREVIEW_TAG: ${{ inputs.preview_tag }}
      A1_RETENTION_DAYS: ${{ inputs.retention_days }}
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch live canonical main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch canonical main."
          }

      - name: Admit the only build source and inputs
        id: admit
        shell: pwsh
        run: python scripts/stateless_preview_artifact.py admit-build

      - name: Set up the preview runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the repository Python runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install uv
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to install the repository Python runner."
          }

      - name: Run required builds and functional producers
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $functionalWorktree = Join-Path $env:RUNNER_TEMP "stateless-preview-functional-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          git -C $env:GITHUB_WORKSPACE worktree add --detach $functionalWorktree $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create the exact-head functional worktree."
          }
          $entered = $false
          try {
            Push-Location $functionalWorktree
            $entered = $true
            @'
          import uuid
          from pathlib import Path

          from scripts import run_sonarqube_exact_head as runner

          environment = runner.scrub_sonar_environment(runner.process_environment())
          context = runner.git_context(Path.cwd(), environment)
          runner.assert_no_in_tree_dotenv(context.repository_root)
          entry = runner.resolve_wave2_entry(context, environment)
          resolved_wave2 = runner.verify_wave2_entry(entry, context, environment)
          runner.assert_post_merge_target(context, environment)
          runner.clear_generated_artifacts(context, environment)
          runner.strict_cleanliness(context, environment, "functional producer start")
          runner.preflight_coverage_toolchain(context=context, environment=environment)
          runner.prepare_worktree_python_environment(context, environment, ())
          solution, _, standalone_projects = runner.project_inventory(context.repository_root)
          for project in (solution, *standalone_projects):
              runner.run_process(
                  ["dotnet", "build", str(project), "-nr:false"],
                  cwd=context.repository_root,
                  environment=environment,
                  secrets=(),
                  label=f"Required build ({project.name})",
              )
          plan = runner.derive_coverage_plan(context, str(uuid.uuid4()))
          claim = runner.claim_coverage_run(context, plan, resolved_wave2)
          stateless_before = runner.capture_stateless_binary_hashes(plan)
          runner.run_coverage_producer(plan, environment)
          dotnet_inputs = runner.validate_dotnet_cobertura_inputs(context, plan)
          normalization = runner.normalize_dotnet_cobertura(plan, dotnet_inputs)
          runner.validate_coverage_reports(
              context, plan, claim, stateless_before,
              dotnet_inputs=dotnet_inputs, normalization=normalization,
          )
          runner.clear_generated_artifacts(context, environment)
          cleanup = runner.cleanup_coverage_run(plan, True)
          if cleanup["status"] != "OK":
              raise runner.RunnerError("Functional producer cleanup failed.")
          runner.strict_cleanliness(context, environment, "functional producer completion")
          runner.assert_head_unchanged(context, environment)
          '@ | python -
            if ($LASTEXITCODE -ne 0) {
              throw "Required build or functional producer failed."
            }
          }
          finally {
            if ($entered) {
              Pop-Location
            }
            git -C $env:GITHUB_WORKSPACE worktree remove --force $functionalWorktree
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to remove the exact-head functional worktree."
            }
          }

      - name: Publish the self-contained win-x64 preview
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish host/NetCoreDbg.Mcp.Stateless.Preview/NetCoreDbg.Mcp.Stateless.Preview.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false --output artifacts/stateless-preview/publish
          if ($LASTEXITCODE -ne 0) {
            throw "Preview publish failed."
          }
          Rename-Item -Path artifacts/stateless-preview/publish/NetCoreDbg.Mcp.Stateless.Preview.exe -NewName netcoredbg-mcp-stateless-preview.exe

      - name: Verify the published embedded runtime
        shell: pwsh
        run: |
          python scripts/stateless_preview_runtime.py --executable artifacts/stateless-preview/publish/netcoredbg-mcp-stateless-preview.exe --expected-runtime 8.0.32 --diagnostics-directory artifacts/stateless-preview/runtime-evidence
          if ($LASTEXITCODE -ne 0) {
            throw "Published preview runtime verification failed."
          }

      - name: Archive and manifest the preview payload
        shell: pwsh
        run: python scripts/stateless_preview_artifact.py prepare-payload

      - name: Retain the immutable preview payload
        id: upload_payload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.payload_artifact_name }}
          path: artifacts/stateless-preview/payload/
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Seal candidate identity and release-gate catalog
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          A1_PAYLOAD_ARTIFACT_ID: ${{ steps.upload_payload.outputs.artifact-id }}
        run: python scripts/stateless_preview_artifact.py seal-build-records

      - name: Retain the immutable Candidate Identity Record
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.candidate_identity_artifact_name }}
          path: artifacts/stateless-preview/records/candidate-identity.json
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Retain the immutable Release Gate Catalog
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.release_gate_catalog_artifact_name }}
          path: artifacts/stateless-preview/records/release-gate-catalog.json
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

  retain_evidence:
    name: Retain canonical-main preview evidence
    if: ${{ inputs.mode == 'evidence' && inputs.evidence_operation != 'permission-probe' }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch live canonical main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch canonical main."
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Admit the exact evidence source and request
        id: admit
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/stateless_preview_artifact.py admit-evidence

      - name: Retain the three original evidence records (E0)
        id: upload_records
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.records_artifact_name }}
          path: |
            ${{ steps.admit.outputs.records_directory }}/consumer-proof.json
            ${{ steps.admit.outputs.records_directory }}/s2-s3-review.json
            ${{ steps.admit.outputs.records_directory }}/independent-pr-review.json
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Read back E0 and seal the pre-decision Stage
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          A1_EVIDENCE_RECORDS_ARTIFACT_ID: ${{ steps.upload_records.outputs.artifact-id }}
          A1_EVIDENCE_RECORDS_ARTIFACT_DIGEST: ${{ steps.upload_records.outputs.artifact-digest }}
        run: python scripts/stateless_preview_artifact.py seal-evidence-stage

      - name: Retain the pre-decision Stage (E1)
        id: upload_stage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.stage_artifact_name }}
          path: ${{ steps.admit.outputs.stage_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Read back E1 and seal the explicit Decision
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          A1_EVIDENCE_RECORDS_ARTIFACT_ID: ${{ steps.upload_records.outputs.artifact-id }}
          A1_EVIDENCE_RECORDS_ARTIFACT_DIGEST: ${{ steps.upload_records.outputs.artifact-digest }}
          A1_EVIDENCE_STAGE_ARTIFACT_ID: ${{ steps.upload_stage.outputs.artifact-id }}
          A1_EVIDENCE_STAGE_ARTIFACT_DIGEST: ${{ steps.upload_stage.outputs.artifact-digest }}
        run: python scripts/stateless_preview_artifact.py seal-evidence-decision

      - name: Retain the explicit Promotion Decision (E2)
        id: upload_decision
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.decision_artifact_name }}
          path: ${{ steps.admit.outputs.decision_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Independently verify all retained evidence
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          A1_EVIDENCE_RECORDS_ARTIFACT_ID: ${{ steps.upload_records.outputs.artifact-id }}
          A1_EVIDENCE_RECORDS_ARTIFACT_DIGEST: ${{ steps.upload_records.outputs.artifact-digest }}
          A1_EVIDENCE_STAGE_ARTIFACT_ID: ${{ steps.upload_stage.outputs.artifact-id }}
          A1_EVIDENCE_STAGE_ARTIFACT_DIGEST: ${{ steps.upload_stage.outputs.artifact-digest }}
          A1_EVIDENCE_DECISION_ARTIFACT_ID: ${{ steps.upload_decision.outputs.artifact-id }}
          A1_EVIDENCE_DECISION_ARTIFACT_DIGEST: ${{ steps.upload_decision.outputs.artifact-digest }}
        run: python scripts/stateless_preview_artifact.py verify-evidence-retention

  probe_permissions:
    name: Probe current job permissions
    if: ${{ inputs.mode == 'evidence' && inputs.evidence_operation == 'permission-probe' }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch live canonical main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch canonical main."
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Admit the exact nonmutating permission probe
        id: admit
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/stateless_preview_artifact.py admit-evidence

      - name: Read the invoking job's runner-reported permissions
        id: probe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/stateless_preview_permissions.py --output current-job-permissions.json

      - name: Retain only the attempted permission diagnostic
        if: ${{ always() && (steps.probe.outcome == 'success' || steps.probe.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: stateless-preview-current-job-permissions-${{ github.run_id }}-${{ github.run_attempt }}
          path: current-job-permissions.json
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

  promote:
    if: ${{ inputs.mode == 'promote' }}
    name: Promote canonical-main preview candidate
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch live canonical main
        shell: pwsh
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch canonical main."
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Admit the retained APPROVE and seal the pre-publication Stage
        id: admit
        shell: pwsh
        run: python scripts/stateless_preview_artifact.py admit-promote

      - name: Read this promote job's actual runner-reported grants
        id: permissions
        shell: pwsh
        env:
          A1_PROMOTE_PERMISSION_PATH: ${{ steps.admit.outputs.permission_path }}
        run: python scripts/stateless_preview_permissions.py --output "$env:A1_PROMOTE_PERMISSION_PATH"

      - name: Retain an unsuccessful permission report without admitting promotion
        if: ${{ always() && steps.admit.outcome == 'success' && steps.permissions.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.admission_artifact_name }}-permission-diagnostic
          path: ${{ steps.admit.outputs.permission_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Observe the initial remote state only after qualified permission readback
        id: observe
        if: ${{ success() && steps.permissions.outcome == 'success' }}
        shell: pwsh
        run: python scripts/stateless_preview_artifact.py observe-promote

      - name: Retain the immutable Stage, report and initial observation (P0)
        id: upload_admission
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.admission_artifact_name }}
          path: |
            ${{ steps.admit.outputs.stage_path }}
            ${{ steps.admit.outputs.permission_path }}
            ${{ steps.observe.outputs.observation_path }}
            ${{ steps.observe.outputs.pre_publication_verification_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Read back P0 and classify the initial state
        id: classify_0
        shell: pwsh
        env:
          A1_PROMOTE_ADMISSION_ARTIFACT_ID: ${{ steps.upload_admission.outputs.artifact-id }}
          A1_PROMOTE_ADMISSION_ARTIFACT_DIGEST: ${{ steps.upload_admission.outputs.artifact-digest }}
        run: |
          $env:A1_PROMOTE_ADMISSION_ARTIFACT_DIGEST = $env:A1_PROMOTE_ADMISSION_ARTIFACT_DIGEST -creplace '^sha256:', ''
          python scripts/stateless_preview_artifact.py classify-promote --step 0

      - name: Retain the initial immutable classification (C0)
        id: upload_classification_0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.classify_0.outputs.classification_artifact_name }}
          path: ${{ steps.classify_0.outputs.classification_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Read back C0 and seal the immutable Attempt
        id: attempt
        shell: pwsh
        env:
          A1_PROMOTE_CLASSIFICATION_ARTIFACT_ID: ${{ steps.upload_classification_0.outputs.artifact-id }}
          A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST: ${{ steps.upload_classification_0.outputs.artifact-digest }}
        run: |
          $env:A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST = $env:A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST -creplace '^sha256:', ''
          python scripts/stateless_preview_artifact.py seal-promote-attempt

      - name: Retain the immutable Attempt (A)
        id: upload_attempt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.attempt.outputs.attempt_artifact_name }}
          path: ${{ steps.attempt.outputs.attempt_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Read back A and execute the first legal advancement
        id: advance_1
        if: ${{ success() && steps.permissions.outcome == 'success' && steps.classify_0.outputs.state != 'published_complete' }}
        shell: pwsh
        env:
          A1_PROMOTE_ATTEMPT_ARTIFACT_ID: ${{ steps.upload_attempt.outputs.artifact-id }}
          A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST: ${{ steps.upload_attempt.outputs.artifact-digest }}
          A1_PROMOTE_CLASSIFICATION_ARTIFACT_ID: ${{ steps.upload_classification_0.outputs.artifact-id }}
          A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST: ${{ steps.upload_classification_0.outputs.artifact-digest }}
        run: |
          $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST = $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST -creplace '^sha256:', ''
          $env:A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST = $env:A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST -creplace '^sha256:', ''
          python scripts/stateless_preview_artifact.py advance-promote --step 1

      - name: Retain the first advancement observation and any pre-publication fragment
        id: upload_observation_1
        if: ${{ always() && (steps.advance_1.outcome == 'success' || steps.advance_1.outcome == 'failure') && steps.advance_1.outputs.observation_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.advance_1.outputs.observation_artifact_name }}
          path: |
            ${{ steps.advance_1.outputs.observation_path }}
            ${{ steps.advance_1.outputs.pre_publication_verification_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Read back the completed first advancement and classify it
        id: classify_1
        if: ${{ success() && steps.advance_1.outcome == 'success' }}
        shell: pwsh
        env:
          A1_PROMOTE_ATTEMPT_ARTIFACT_ID: ${{ steps.upload_attempt.outputs.artifact-id }}
          A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST: ${{ steps.upload_attempt.outputs.artifact-digest }}
          A1_PROMOTE_OBSERVATION_ARTIFACT_ID: ${{ steps.upload_observation_1.outputs.artifact-id }}
          A1_PROMOTE_OBSERVATION_ARTIFACT_DIGEST: ${{ steps.upload_observation_1.outputs.artifact-digest }}
        run: |
          $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST = $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST -creplace '^sha256:', ''
          $env:A1_PROMOTE_OBSERVATION_ARTIFACT_DIGEST = $env:A1_PROMOTE_OBSERVATION_ARTIFACT_DIGEST -creplace '^sha256:', ''
          python scripts/stateless_preview_artifact.py classify-promote --step 1

      - name: Retain the first advancement classification (C1)
        id: upload_classification_1
        if: ${{ success() && steps.classify_1.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.classify_1.outputs.classification_artifact_name }}
          path: ${{ steps.classify_1.outputs.classification_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Execute the second legal advancement from retained C1
        id: advance_2
        if: ${{ success() && steps.permissions.outcome == 'success' && steps.classify_1.outcome == 'success' && steps.classify_1.outputs.state != 'published_complete' }}
        shell: pwsh
        env:
          A1_PROMOTE_ATTEMPT_ARTIFACT_ID: ${{ steps.upload_attempt.outputs.artifact-id }}
          A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST: ${{ steps.upload_attempt.outputs.artifact-digest }}
          A1_PROMOTE_CLASSIFICATION_ARTIFACT_ID: ${{ steps.upload_classification_1.outputs.artifact-id }}
          A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST: ${{ steps.upload_classification_1.outputs.artifact-digest }}
        run: |
          $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST = $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST -creplace '^sha256:', ''
          $env:A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST = $env:A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST -creplace '^sha256:', ''
          python scripts/stateless_preview_artifact.py advance-promote --step 2

      - name: Retain the second advancement observation and any pre-publication fragment
        id: upload_observation_2
        if: ${{ always() && (steps.advance_2.outcome == 'success' || steps.advance_2.outcome == 'failure') && steps.advance_2.outputs.observation_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.advance_2.outputs.observation_artifact_name }}
          path: |
            ${{ steps.advance_2.outputs.observation_path }}
            ${{ steps.advance_2.outputs.pre_publication_verification_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Read back the completed second advancement and classify it
        id: classify_2
        if: ${{ success() && steps.advance_2.outcome == 'success' }}
        shell: pwsh
        env:
          A1_PROMOTE_ATTEMPT_ARTIFACT_ID: ${{ steps.upload_attempt.outputs.artifact-id }}
          A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST: ${{ steps.upload_attempt.outputs.artifact-digest }}
          A1_PROMOTE_OBSERVATION_ARTIFACT_ID: ${{ steps.upload_observation_2.outputs.artifact-id }}
          A1_PROMOTE_OBSERVATION_ARTIFACT_DIGEST: ${{ steps.upload_observation_2.outputs.artifact-digest }}
        run: |
          $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST = $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST -creplace '^sha256:', ''
          $env:A1_PROMOTE_OBSERVATION_ARTIFACT_DIGEST = $env:A1_PROMOTE_OBSERVATION_ARTIFACT_DIGEST -creplace '^sha256:', ''
          python scripts/stateless_preview_artifact.py classify-promote --step 2

      - name: Retain the second advancement classification (C2)
        id: upload_classification_2
        if: ${{ success() && steps.classify_2.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.classify_2.outputs.classification_artifact_name }}
          path: ${{ steps.classify_2.outputs.classification_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Execute the third and final legal advancement from retained C2
        id: advance_3
        if: ${{ success() && steps.permissions.outcome == 'success' && steps.classify_2.outcome == 'success' && steps.classify_2.outputs.state != 'published_complete' }}
        shell: pwsh
        env:
          A1_PROMOTE_ATTEMPT_ARTIFACT_ID: ${{ steps.upload_attempt.outputs.artifact-id }}
          A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST: ${{ steps.upload_attempt.outputs.artifact-digest }}
          A1_PROMOTE_CLASSIFICATION_ARTIFACT_ID: ${{ steps.upload_classification_2.outputs.artifact-id }}
          A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST: ${{ steps.upload_classification_2.outputs.artifact-digest }}
        run: |
          $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST = $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST -creplace '^sha256:', ''
          $env:A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST = $env:A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST -creplace '^sha256:', ''
          python scripts/stateless_preview_artifact.py advance-promote --step 3

      - name: Retain the final advancement observation and any pre-publication fragment
        id: upload_observation_3
        if: ${{ always() && (steps.advance_3.outcome == 'success' || steps.advance_3.outcome == 'failure') && steps.advance_3.outputs.observation_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.advance_3.outputs.observation_artifact_name }}
          path: |
            ${{ steps.advance_3.outputs.observation_path }}
            ${{ steps.advance_3.outputs.pre_publication_verification_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Read back the completed final advancement and classify it
        id: classify_3
        if: ${{ success() && steps.advance_3.outcome == 'success' }}
        shell: pwsh
        env:
          A1_PROMOTE_ATTEMPT_ARTIFACT_ID: ${{ steps.upload_attempt.outputs.artifact-id }}
          A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST: ${{ steps.upload_attempt.outputs.artifact-digest }}
          A1_PROMOTE_OBSERVATION_ARTIFACT_ID: ${{ steps.upload_observation_3.outputs.artifact-id }}
          A1_PROMOTE_OBSERVATION_ARTIFACT_DIGEST: ${{ steps.upload_observation_3.outputs.artifact-digest }}
        run: |
          $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST = $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST -creplace '^sha256:', ''
          $env:A1_PROMOTE_OBSERVATION_ARTIFACT_DIGEST = $env:A1_PROMOTE_OBSERVATION_ARTIFACT_DIGEST -creplace '^sha256:', ''
          python scripts/stateless_preview_artifact.py classify-promote --step 3

      - name: Retain the final advancement classification (C3)
        id: upload_classification_3
        if: ${{ success() && steps.classify_3.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.classify_3.outputs.classification_artifact_name }}
          path: ${{ steps.classify_3.outputs.classification_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Read back A and the last retained classification for the exact handoff
        id: finish
        if: ${{ success() && steps.permissions.outcome == 'success' }}
        shell: pwsh
        env:
          A1_PROMOTE_FINAL_STEP: ${{ steps.classify_3.outputs.state && '3' || steps.classify_2.outputs.state && '2' || steps.classify_1.outputs.state && '1' || '0' }}
          A1_PROMOTE_ATTEMPT_ARTIFACT_ID: ${{ steps.upload_attempt.outputs.artifact-id }}
          A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST: ${{ steps.upload_attempt.outputs.artifact-digest }}
          A1_PROMOTE_CLASSIFICATION_ARTIFACT_ID: ${{ steps.upload_classification_3.outputs.artifact-id || steps.upload_classification_2.outputs.artifact-id || steps.upload_classification_1.outputs.artifact-id || steps.upload_classification_0.outputs.artifact-id }}
          A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST: ${{ steps.upload_classification_3.outputs.artifact-digest || steps.upload_classification_2.outputs.artifact-digest || steps.upload_classification_1.outputs.artifact-digest || steps.upload_classification_0.outputs.artifact-digest }}
        run: |
          $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST = $env:A1_PROMOTE_ATTEMPT_ARTIFACT_DIGEST -creplace '^sha256:', ''
          $env:A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST = $env:A1_PROMOTE_CLASSIFICATION_ARTIFACT_DIGEST -creplace '^sha256:', ''
          python scripts/stateless_preview_artifact.py finish-promote --step $env:A1_PROMOTE_FINAL_STEP

      - name: Retain exact published references for separate remote consumer proof
        id: upload_handoff
        if: ${{ success() && steps.finish.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.attempt_artifact_name }}-handoff
          path: ${{ steps.finish.outputs.handoff_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}

      - name: Retain only bounded publisher command diagnostics
        if: ${{ always() && steps.admit.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.admit.outputs.attempt_artifact_name }}-diagnostics
          path: |
            ${{ steps.admit.outputs.diagnostics_path }}
            ${{ steps.observe.outputs.diagnostics_path }}
            ${{ steps.classify_0.outputs.diagnostics_path }}
            ${{ steps.attempt.outputs.diagnostics_path }}
            ${{ steps.advance_1.outputs.diagnostics_path }}
            ${{ steps.classify_1.outputs.diagnostics_path }}
            ${{ steps.advance_2.outputs.diagnostics_path }}
            ${{ steps.classify_2.outputs.diagnostics_path }}
            ${{ steps.advance_3.outputs.diagnostics_path }}
            ${{ steps.classify_3.outputs.diagnostics_path }}
            ${{ steps.finish.outputs.diagnostics_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.admit.outputs.retention_days }}
